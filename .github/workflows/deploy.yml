name: CI/CD - Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      # Docker Hub ga login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker image ni build va push qilish
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/networking-assignment-app:latest
          platforms: linux/amd64

      # EC2 ga deploy qilish
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deployment boshlandi..."

            cd /home/ubuntu

            # docker-compose.yml mavjudligini tekshirish
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml topilmadi!"
              exit 1
            fi

            docker compose down || true
            docker compose pull
            docker compose up -d

            echo "✅ Deployment muvaffaqiyatli yakunlandi!"
            docker compose ps
            docker compose logs --tail=20 networking-app
