name: CI/CD - Deploy to AWS EC2 with Docker Compose

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/networking-assignment-app:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 with Docker Compose
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Loyiha papkasiga o'tish (agar kerak bo'lsa)
            cd /home/ubuntu || true
            
            # docker-compose.yml mavjudligini tekshirish
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml topilmadi!"
              exit 1
            fi
            
            # Eski containerlarni to'xtatish
            docker compose down || true
            
            # Yangi imageni pull qilish
            docker compose pull
            
            # Yangi versiyani ishga tushirish
            docker compose up -d
            
            echo "✅ Deployment completed successfully at $(date)"
            echo "============================================"
            docker compose ps
            docker compose logs --tail=20 networking-app
